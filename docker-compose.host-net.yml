# Linux-only override: share the host network stack so the container reaches
# Lemonade, ComfyUI and any legacy speech services on 127.0.0.1 exactly as a
# host install does.
#
#   docker compose -f docker-compose.yml -f docker-compose.host-net.yml up -d
#
# The app then binds the host's port 3005 directly and ODM_PORT has no effect.
# Needs Docker Compose v2.24+ for the !reset tag, and does not work on Docker
# Desktop for macOS or Windows.

services:
  open-dungeon-master:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      LEMONADE_BASE_URL: ${LEMONADE_BASE_URL:-http://127.0.0.1:13305}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-http://127.0.0.1:13305/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      COMFYUI_URL: ${COMFYUI_URL:-http://127.0.0.1:8188}
      KOKORO_URL: ${KOKORO_URL:-}
      STT_URL: ${STT_URL:-}
      LEMONADE_TEXT_MODEL: ${LEMONADE_TEXT_MODEL:-Qwen3.6-35B-A3B-MTP-ROCmFP4-GGUF-STRIX-embF16-headQ6}
      LEMONADE_CONTEXT_TOKENS: ${LEMONADE_CONTEXT_TOKENS:-262144}
      DM_MAX_OUTPUT_TOKENS: ${DM_MAX_OUTPUT_TOKENS:-2048}
      DM_THINKING: ${DM_THINKING:-0}
      LEMONADE_MAX_OUTPUT_TOKENS: ${LEMONADE_MAX_OUTPUT_TOKENS:-4096}
      LEMONADE_TTS_MODEL: ${LEMONADE_TTS_MODEL:-kokoro-v1}
      LEMONADE_STT_MODEL: ${LEMONADE_STT_MODEL:-Moonshine-Medium-Streaming}
      LEMONADE_IMAGE_MODEL: ${LEMONADE_IMAGE_MODEL:-Z-Image-Turbo-TheNoise}
      VOICE_GATEWAY_ENABLED: ${VOICE_GATEWAY_ENABLED:-1}
      VOICE_GATEWAY_HOST: ${VOICE_GATEWAY_HOST:-0.0.0.0}
      VOICE_GATEWAY_PORT: ${VOICE_GATEWAY_PORT:-8765}
      NEXT_BASE_URL: ${NEXT_BASE_URL:-http://127.0.0.1:3005}
      VOICE_GATEWAY_PUBLIC_URL: ${VOICE_GATEWAY_PUBLIC_URL:-}
      VOICE_GATEWAY_ORIGINS: ${VOICE_GATEWAY_ORIGINS:-}
